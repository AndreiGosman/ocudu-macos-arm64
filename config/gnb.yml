# OCUDU gNB for a 5G SA loopback on macOS ARM64: ZeroMQ radio paired with srsUE (srsue/ue.conf), Open5GS 5GC as core.
# Derived from configs/gnb_rf_b210_fdd_srsUE.yml in the OCUDU tree (pdcch/prach/mcs parameters for srsUE), with the
# cell and the radio aligned to the loopback setup.
#
# Rules learned on macOS:
# - NGAP binds to the REAL 127.0.0.1, never to an lo0 alias (the SCTP handshake "succeeds" on an alias and then
#   nothing flows).
# - The gNB process runs the SCTP shim on its own UDP encapsulation port and points it at the AMF's:
#     LIBSCTP_COMPAT_UDP_ENCAPS_PORT=9900 LIBSCTP_COMPAT_UDP_ENCAPS_REMOTE_PORT=9899
#   (the Open5GS AMF runs native usrsctp on UDP 9899).
# - ZeroMQ: gNB tx 2000 / rx 2001, UE tx 2001 / rx 2000; base_srate must match the UE.
# - ZeroMQ gains must be 0 dB or lower in OCUDU 26.10 (the driver scales by the gain).
# Placeholders: @LOGDIR@ is rendered by render.sh.

cu_cp:
  amf:
    addrs: 127.0.0.1
    port: 38412
    bind_addrs: 127.0.0.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://127.0.0.1:2000,rx_port=tcp://127.0.0.1:2001,base_srate=11.52e6
  srate: 11.52
  tx_gain: 0
  rx_gain: 0

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 10
  common_scs: 15
  plmn: "00101"
  tac: 7
  pci: 500
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 6
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: stdout
  all_level: info

pcap:
  mac_enable: true
  mac_filename: @LOGDIR@/ocudu-5gsa-gnb-mac.pcap
  ngap_enable: true
  ngap_filename: @LOGDIR@/ocudu-5gsa-gnb-ngap.pcap
